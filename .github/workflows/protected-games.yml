name: Build protected games
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SamiDev_Platform/tools/js-protection/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        working-directory: SamiDev_Platform/tools/js-protection
        run: npm ci --ignore-scripts
      - name: Protect, verify and package all four games
        run: python SamiDev_Platform/tools/package_game_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: plazr-protected-games
          if-no-files-found: error
          retention-days: 7
          path: |
            SamiDev_Platform/build/plazr-protected-games.zip
            SamiDev_Platform/build/plazr-protected-games.zip.sha256
