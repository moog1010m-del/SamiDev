name: SamiDev
options:
  bundleIdPrefix: com.samidev
targets:
  SamiDev:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - SamiDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samidev.game
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
