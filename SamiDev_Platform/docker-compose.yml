x-gamehost: &gamehost
  build:
    context: .
    dockerfile: gamehost/Dockerfile
  restart: unless-stopped
  environment:
    SAMIDEV_GAMEHOST_PORT: 8091
    SAMIDEV_GAME_DIR: /app/game
    SAMIDEV_GAMEHOST_ROOM_IDLE_MS: "21600000"
    SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
    SAMIDEV_POOL_RECORD_DIR: ${SAMIDEV_POOL_RECORD_DIR:-}
  volumes:
    - samidev_pool_recordings:/app/recordings
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 2s
    retries: 30

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SAMIDEV_POSTGRES_USER:-samidev}
      POSTGRES_DB: ${SAMIDEV_POSTGRES_DB:-samidev}
      POSTGRES_PASSWORD: ${SAMIDEV_POSTGRES_PASSWORD:?SAMIDEV_POSTGRES_PASSWORD is required}
    volumes:
      - samidev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - samidev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  gamehost1:
    <<: *gamehost
  gamehost2:
    <<: *gamehost
  gamehost3:
    <<: *gamehost

  gateway1: &gateway
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    environment:
      SAMIDEV_STORE: redis
      SAMIDEV_PLATFORM_STORE: postgres
      SAMIDEV_DATABASE_URL: ${SAMIDEV_DATABASE_URL:?SAMIDEV_DATABASE_URL is required}
      SAMIDEV_DATABASE_POOL_SIZE: ${SAMIDEV_DATABASE_POOL_SIZE:-10}
      SAMIDEV_REDIS_URL: ${SAMIDEV_REDIS_URL:-redis://redis:6379/0}
      SAMIDEV_GAMEHOST_URLS: http://gamehost1:8091,http://gamehost2:8091,http://gamehost3:8091
      SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
      SAMIDEV_TRUST_PROXY: "1"
      SAMIDEV_CREATE_RATE_PER_MINUTE: ${SAMIDEV_CREATE_RATE_PER_MINUTE:-600}
      SAMIDEV_JOIN_RATE_PER_MINUTE: ${SAMIDEV_JOIN_RATE_PER_MINUTE:-1200}
      SAMIDEV_INVITE_RATE_PER_MINUTE: ${SAMIDEV_INVITE_RATE_PER_MINUTE:-30}
      SAMIDEV_INVITE_TTL_SECONDS: ${SAMIDEV_INVITE_TTL_SECONDS:-600}
      SAMIDEV_PRODUCTION: "1"
      SAMIDEV_REQUIRE_GAME_AUTH: ${SAMIDEV_REQUIRE_GAME_AUTH:-1}
      SAMIDEV_ROOM_WAIT_SECONDS: ${SAMIDEV_ROOM_WAIT_SECONDS:-300}
      SAMIDEV_FIREBASE_AUTH: ${SAMIDEV_FIREBASE_AUTH:-0}
      SAMIDEV_GOOGLE_WEB_CLIENT_ID: ${SAMIDEV_GOOGLE_WEB_CLIENT_ID:-}
      SAMIDEV_GOOGLE_IOS_CLIENT_ID: ${SAMIDEV_GOOGLE_IOS_CLIENT_ID:-}
      SAMIDEV_FIREBASE_PROJECT_ID: ${SAMIDEV_FIREBASE_PROJECT_ID:-}
      SAMIDEV_FIREBASE_API_KEY: ${SAMIDEV_FIREBASE_API_KEY:-}
      SAMIDEV_FIREBASE_ADMIN_UID: ${SAMIDEV_FIREBASE_ADMIN_UID:-}
      SAMIDEV_SESSION_TTL_SECONDS: ${SAMIDEV_SESSION_TTL_SECONDS:-2592000}
      SAMIDEV_GAME_TICKET_TTL_SECONDS: ${SAMIDEV_GAME_TICKET_TTL_SECONDS:-45}
      SAMIDEV_ADMIN_USERNAME: ${SAMIDEV_ADMIN_USERNAME:-}
      SAMIDEV_ADMIN_PASSWORD: ${SAMIDEV_ADMIN_PASSWORD:-}
      SAMIDEV_CHAT_MAX_CHARS: ${SAMIDEV_CHAT_MAX_CHARS:-160}
      SAMIDEV_CHAT_RATE_MESSAGES: ${SAMIDEV_CHAT_RATE_MESSAGES:-8}
      SAMIDEV_CHAT_RATE_WINDOW: ${SAMIDEV_CHAT_RATE_WINDOW:-10}
      SAMIDEV_NODE_ID: gateway-1
      SAMIDEV_PORT: 8088
      SAMIDEV_ALLOWED_ORIGINS: ${SAMIDEV_ALLOWED_ORIGINS:?SAMIDEV_ALLOWED_ORIGINS is required}
      SAMIDEV_MAX_MSG_RATE: "90"
      SAMIDEV_RATE_BURST: "150"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gamehost1:
        condition: service_healthy
      gamehost2:
        condition: service_healthy
      gamehost3:
        condition: service_healthy

  gateway2:
    <<: *gateway
    environment:
      SAMIDEV_STORE: redis
      SAMIDEV_PLATFORM_STORE: postgres
      SAMIDEV_DATABASE_URL: ${SAMIDEV_DATABASE_URL:?SAMIDEV_DATABASE_URL is required}
      SAMIDEV_DATABASE_POOL_SIZE: ${SAMIDEV_DATABASE_POOL_SIZE:-10}
      SAMIDEV_REDIS_URL: ${SAMIDEV_REDIS_URL:-redis://redis:6379/0}
      SAMIDEV_GAMEHOST_URLS: http://gamehost1:8091,http://gamehost2:8091,http://gamehost3:8091
      SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
      SAMIDEV_TRUST_PROXY: "1"
      SAMIDEV_CREATE_RATE_PER_MINUTE: ${SAMIDEV_CREATE_RATE_PER_MINUTE:-600}
      SAMIDEV_JOIN_RATE_PER_MINUTE: ${SAMIDEV_JOIN_RATE_PER_MINUTE:-1200}
      SAMIDEV_INVITE_RATE_PER_MINUTE: ${SAMIDEV_INVITE_RATE_PER_MINUTE:-30}
      SAMIDEV_INVITE_TTL_SECONDS: ${SAMIDEV_INVITE_TTL_SECONDS:-600}
      SAMIDEV_PRODUCTION: "1"
      SAMIDEV_REQUIRE_GAME_AUTH: ${SAMIDEV_REQUIRE_GAME_AUTH:-1}
      SAMIDEV_ROOM_WAIT_SECONDS: ${SAMIDEV_ROOM_WAIT_SECONDS:-300}
      SAMIDEV_FIREBASE_AUTH: ${SAMIDEV_FIREBASE_AUTH:-0}
      SAMIDEV_GOOGLE_WEB_CLIENT_ID: ${SAMIDEV_GOOGLE_WEB_CLIENT_ID:-}
      SAMIDEV_GOOGLE_IOS_CLIENT_ID: ${SAMIDEV_GOOGLE_IOS_CLIENT_ID:-}
      SAMIDEV_FIREBASE_PROJECT_ID: ${SAMIDEV_FIREBASE_PROJECT_ID:-}
      SAMIDEV_FIREBASE_API_KEY: ${SAMIDEV_FIREBASE_API_KEY:-}
      SAMIDEV_FIREBASE_ADMIN_UID: ${SAMIDEV_FIREBASE_ADMIN_UID:-}
      SAMIDEV_SESSION_TTL_SECONDS: ${SAMIDEV_SESSION_TTL_SECONDS:-2592000}
      SAMIDEV_GAME_TICKET_TTL_SECONDS: ${SAMIDEV_GAME_TICKET_TTL_SECONDS:-45}
      SAMIDEV_ADMIN_USERNAME: ${SAMIDEV_ADMIN_USERNAME:-}
      SAMIDEV_ADMIN_PASSWORD: ${SAMIDEV_ADMIN_PASSWORD:-}
      SAMIDEV_CHAT_MAX_CHARS: ${SAMIDEV_CHAT_MAX_CHARS:-160}
      SAMIDEV_CHAT_RATE_MESSAGES: ${SAMIDEV_CHAT_RATE_MESSAGES:-8}
      SAMIDEV_CHAT_RATE_WINDOW: ${SAMIDEV_CHAT_RATE_WINDOW:-10}
      SAMIDEV_NODE_ID: gateway-2
      SAMIDEV_PORT: 8088
      SAMIDEV_ALLOWED_ORIGINS: ${SAMIDEV_ALLOWED_ORIGINS:?SAMIDEV_ALLOWED_ORIGINS is required}
      SAMIDEV_MAX_MSG_RATE: "90"
      SAMIDEV_RATE_BURST: "150"

  gateway3:
    <<: *gateway
    environment:
      SAMIDEV_STORE: redis
      SAMIDEV_PLATFORM_STORE: postgres
      SAMIDEV_DATABASE_URL: ${SAMIDEV_DATABASE_URL:?SAMIDEV_DATABASE_URL is required}
      SAMIDEV_DATABASE_POOL_SIZE: ${SAMIDEV_DATABASE_POOL_SIZE:-10}
      SAMIDEV_REDIS_URL: ${SAMIDEV_REDIS_URL:-redis://redis:6379/0}
      SAMIDEV_GAMEHOST_URLS: http://gamehost1:8091,http://gamehost2:8091,http://gamehost3:8091
      SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
      SAMIDEV_TRUST_PROXY: "1"
      SAMIDEV_CREATE_RATE_PER_MINUTE: ${SAMIDEV_CREATE_RATE_PER_MINUTE:-600}
      SAMIDEV_JOIN_RATE_PER_MINUTE: ${SAMIDEV_JOIN_RATE_PER_MINUTE:-1200}
      SAMIDEV_INVITE_RATE_PER_MINUTE: ${SAMIDEV_INVITE_RATE_PER_MINUTE:-30}
      SAMIDEV_INVITE_TTL_SECONDS: ${SAMIDEV_INVITE_TTL_SECONDS:-600}
      SAMIDEV_PRODUCTION: "1"
      SAMIDEV_REQUIRE_GAME_AUTH: ${SAMIDEV_REQUIRE_GAME_AUTH:-1}
      SAMIDEV_ROOM_WAIT_SECONDS: ${SAMIDEV_ROOM_WAIT_SECONDS:-300}
      SAMIDEV_FIREBASE_AUTH: ${SAMIDEV_FIREBASE_AUTH:-0}
      SAMIDEV_GOOGLE_WEB_CLIENT_ID: ${SAMIDEV_GOOGLE_WEB_CLIENT_ID:-}
      SAMIDEV_GOOGLE_IOS_CLIENT_ID: ${SAMIDEV_GOOGLE_IOS_CLIENT_ID:-}
      SAMIDEV_FIREBASE_PROJECT_ID: ${SAMIDEV_FIREBASE_PROJECT_ID:-}
      SAMIDEV_FIREBASE_API_KEY: ${SAMIDEV_FIREBASE_API_KEY:-}
      SAMIDEV_FIREBASE_ADMIN_UID: ${SAMIDEV_FIREBASE_ADMIN_UID:-}
      SAMIDEV_SESSION_TTL_SECONDS: ${SAMIDEV_SESSION_TTL_SECONDS:-2592000}
      SAMIDEV_GAME_TICKET_TTL_SECONDS: ${SAMIDEV_GAME_TICKET_TTL_SECONDS:-45}
      SAMIDEV_ADMIN_USERNAME: ${SAMIDEV_ADMIN_USERNAME:-}
      SAMIDEV_ADMIN_PASSWORD: ${SAMIDEV_ADMIN_PASSWORD:-}
      SAMIDEV_CHAT_MAX_CHARS: ${SAMIDEV_CHAT_MAX_CHARS:-160}
      SAMIDEV_CHAT_RATE_MESSAGES: ${SAMIDEV_CHAT_RATE_MESSAGES:-8}
      SAMIDEV_CHAT_RATE_WINDOW: ${SAMIDEV_CHAT_RATE_WINDOW:-10}
      SAMIDEV_NODE_ID: gateway-3
      SAMIDEV_PORT: 8088
      SAMIDEV_ALLOWED_ORIGINS: ${SAMIDEV_ALLOWED_ORIGINS:?SAMIDEV_ALLOWED_ORIGINS is required}
      SAMIDEV_MAX_MSG_RATE: "90"
      SAMIDEV_RATE_BURST: "150"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SAMIDEV_BIND_IP:-127.0.0.1}:${SAMIDEV_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./game:/usr/share/nginx/html:ro
    depends_on:
      gateway1:
        condition: service_healthy
      gateway2:
        condition: service_healthy
      gateway3:
        condition: service_healthy

volumes:
  samidev_postgres:
  samidev_redis:
  samidev_pool_recordings:
