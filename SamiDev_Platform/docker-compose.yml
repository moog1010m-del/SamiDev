x-gamehost: &gamehost
  build:
    context: .
    dockerfile: gamehost/Dockerfile
  restart: unless-stopped
  environment:
    SAMIDEV_GAMEHOST_PORT: 8091
    SAMIDEV_GAME_DIR: /app/game
    SAMIDEV_GAMEHOST_ROOM_IDLE_MS: "21600000"
    SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 2s
    retries: 30

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - samidev_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  gamehost1:
    <<: *gamehost
  gamehost2:
    <<: *gamehost
  gamehost3:
    <<: *gamehost

  gateway1: &gateway
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SAMIDEV_STORE: redis
      SAMIDEV_REDIS_URL: ${SAMIDEV_REDIS_URL:-redis://redis:6379/0}
      SAMIDEV_GAMEHOST_URLS: http://gamehost1:8091,http://gamehost2:8091,http://gamehost3:8091
      SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
      SAMIDEV_TRUST_PROXY: "1"
      SAMIDEV_CREATE_RATE_PER_MINUTE: ${SAMIDEV_CREATE_RATE_PER_MINUTE:-600}
      SAMIDEV_JOIN_RATE_PER_MINUTE: ${SAMIDEV_JOIN_RATE_PER_MINUTE:-1200}
      SAMIDEV_INVITE_RATE_PER_MINUTE: ${SAMIDEV_INVITE_RATE_PER_MINUTE:-30}
      SAMIDEV_INVITE_TTL_SECONDS: ${SAMIDEV_INVITE_TTL_SECONDS:-600}
      SAMIDEV_PRODUCTION: "1"
      SAMIDEV_REQUIRE_GAME_AUTH: ${SAMIDEV_REQUIRE_GAME_AUTH:-1}
      SAMIDEV_SESSION_TTL_SECONDS: ${SAMIDEV_SESSION_TTL_SECONDS:-2592000}
      SAMIDEV_GAME_TICKET_TTL_SECONDS: ${SAMIDEV_GAME_TICKET_TTL_SECONDS:-45}
      SAMIDEV_ADMIN_USERNAME: ${SAMIDEV_ADMIN_USERNAME:-}
      SAMIDEV_ADMIN_PASSWORD: ${SAMIDEV_ADMIN_PASSWORD:-}
      SAMIDEV_CHAT_MAX_CHARS: ${SAMIDEV_CHAT_MAX_CHARS:-160}
      SAMIDEV_CHAT_RATE_MESSAGES: ${SAMIDEV_CHAT_RATE_MESSAGES:-8}
      SAMIDEV_CHAT_RATE_WINDOW: ${SAMIDEV_CHAT_RATE_WINDOW:-10}
      SAMIDEV_NODE_ID: gateway-1
      SAMIDEV_PORT: 8088
      SAMIDEV_ALLOWED_ORIGINS: ${SAMIDEV_ALLOWED_ORIGINS:?SAMIDEV_ALLOWED_ORIGINS is required}
      SAMIDEV_MAX_MSG_RATE: "90"
      SAMIDEV_RATE_BURST: "150"
    depends_on:
      redis:
        condition: service_healthy
      gamehost1:
        condition: service_healthy
      gamehost2:
        condition: service_healthy
      gamehost3:
        condition: service_healthy

  gateway2:
    <<: *gateway
    environment:
      SAMIDEV_STORE: redis
      SAMIDEV_REDIS_URL: ${SAMIDEV_REDIS_URL:-redis://redis:6379/0}
      SAMIDEV_GAMEHOST_URLS: http://gamehost1:8091,http://gamehost2:8091,http://gamehost3:8091
      SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
      SAMIDEV_TRUST_PROXY: "1"
      SAMIDEV_CREATE_RATE_PER_MINUTE: ${SAMIDEV_CREATE_RATE_PER_MINUTE:-600}
      SAMIDEV_JOIN_RATE_PER_MINUTE: ${SAMIDEV_JOIN_RATE_PER_MINUTE:-1200}
      SAMIDEV_INVITE_RATE_PER_MINUTE: ${SAMIDEV_INVITE_RATE_PER_MINUTE:-30}
      SAMIDEV_INVITE_TTL_SECONDS: ${SAMIDEV_INVITE_TTL_SECONDS:-600}
      SAMIDEV_PRODUCTION: "1"
      SAMIDEV_REQUIRE_GAME_AUTH: ${SAMIDEV_REQUIRE_GAME_AUTH:-1}
      SAMIDEV_SESSION_TTL_SECONDS: ${SAMIDEV_SESSION_TTL_SECONDS:-2592000}
      SAMIDEV_GAME_TICKET_TTL_SECONDS: ${SAMIDEV_GAME_TICKET_TTL_SECONDS:-45}
      SAMIDEV_ADMIN_USERNAME: ${SAMIDEV_ADMIN_USERNAME:-}
      SAMIDEV_ADMIN_PASSWORD: ${SAMIDEV_ADMIN_PASSWORD:-}
      SAMIDEV_CHAT_MAX_CHARS: ${SAMIDEV_CHAT_MAX_CHARS:-160}
      SAMIDEV_CHAT_RATE_MESSAGES: ${SAMIDEV_CHAT_RATE_MESSAGES:-8}
      SAMIDEV_CHAT_RATE_WINDOW: ${SAMIDEV_CHAT_RATE_WINDOW:-10}
      SAMIDEV_NODE_ID: gateway-2
      SAMIDEV_PORT: 8088
      SAMIDEV_ALLOWED_ORIGINS: ${SAMIDEV_ALLOWED_ORIGINS:?SAMIDEV_ALLOWED_ORIGINS is required}
      SAMIDEV_MAX_MSG_RATE: "90"
      SAMIDEV_RATE_BURST: "150"

  gateway3:
    <<: *gateway
    environment:
      SAMIDEV_STORE: redis
      SAMIDEV_REDIS_URL: ${SAMIDEV_REDIS_URL:-redis://redis:6379/0}
      SAMIDEV_GAMEHOST_URLS: http://gamehost1:8091,http://gamehost2:8091,http://gamehost3:8091
      SAMIDEV_GAMEHOST_SERVICE_KEY: ${SAMIDEV_GAMEHOST_SERVICE_KEY:?SAMIDEV_GAMEHOST_SERVICE_KEY is required}
      SAMIDEV_TRUST_PROXY: "1"
      SAMIDEV_CREATE_RATE_PER_MINUTE: ${SAMIDEV_CREATE_RATE_PER_MINUTE:-600}
      SAMIDEV_JOIN_RATE_PER_MINUTE: ${SAMIDEV_JOIN_RATE_PER_MINUTE:-1200}
      SAMIDEV_INVITE_RATE_PER_MINUTE: ${SAMIDEV_INVITE_RATE_PER_MINUTE:-30}
      SAMIDEV_INVITE_TTL_SECONDS: ${SAMIDEV_INVITE_TTL_SECONDS:-600}
      SAMIDEV_PRODUCTION: "1"
      SAMIDEV_REQUIRE_GAME_AUTH: ${SAMIDEV_REQUIRE_GAME_AUTH:-1}
      SAMIDEV_SESSION_TTL_SECONDS: ${SAMIDEV_SESSION_TTL_SECONDS:-2592000}
      SAMIDEV_GAME_TICKET_TTL_SECONDS: ${SAMIDEV_GAME_TICKET_TTL_SECONDS:-45}
      SAMIDEV_ADMIN_USERNAME: ${SAMIDEV_ADMIN_USERNAME:-}
      SAMIDEV_ADMIN_PASSWORD: ${SAMIDEV_ADMIN_PASSWORD:-}
      SAMIDEV_CHAT_MAX_CHARS: ${SAMIDEV_CHAT_MAX_CHARS:-160}
      SAMIDEV_CHAT_RATE_MESSAGES: ${SAMIDEV_CHAT_RATE_MESSAGES:-8}
      SAMIDEV_CHAT_RATE_WINDOW: ${SAMIDEV_CHAT_RATE_WINDOW:-10}
      SAMIDEV_NODE_ID: gateway-3
      SAMIDEV_PORT: 8088
      SAMIDEV_ALLOWED_ORIGINS: ${SAMIDEV_ALLOWED_ORIGINS:?SAMIDEV_ALLOWED_ORIGINS is required}
      SAMIDEV_MAX_MSG_RATE: "90"
      SAMIDEV_RATE_BURST: "150"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SAMIDEV_BIND_IP:-127.0.0.1}:${SAMIDEV_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./game:/usr/share/nginx/html:ro
    depends_on:
      - gateway1
      - gateway2
      - gateway3

volumes:
  samidev_redis:
