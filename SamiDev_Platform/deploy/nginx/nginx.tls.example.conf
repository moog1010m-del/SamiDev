# Production TLS example. This file is intentionally not mounted by docker-compose
# because certificate paths/domain names are deployment-specific.
# Copy the security/upstream settings from nginx.conf, then use a server like this:
server {
    listen 80;
    server_name game.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only enable HSTS after HTTPS is confirmed for the production domain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reuse the /ws, /health, /metrics and static locations from nginx.conf.
    # WebSockets will automatically become WSS when the page is served over HTTPS.
}
