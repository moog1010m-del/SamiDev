worker_processes auto;
events {
    worker_connections 16384;
    multi_accept on;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $samidev_forwarded_proto {
        default $scheme;
        https https;
    }

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn_per_ip:10m;

    upstream samidev_realtime {
        least_conn;
        server gateway1:8088 max_fails=3 fail_timeout=5s;
        server gateway2:8088 max_fails=3 fail_timeout=5s;
        server gateway3:8088 max_fails=3 fail_timeout=5s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

        location = / {
            return 302 /platform/;
        }

        # Keep the platform HTML and its assets with the backend image. A stale
        # host-side game/ volume must not hide newly deployed game selectors.
        location ^~ /platform/ {
            proxy_pass http://samidev_realtime;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /samidev-games.js {
            proxy_pass http://samidev_realtime;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=60 nodelay;
            proxy_pass http://samidev_realtime;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $samidev_forwarded_proto;
            proxy_buffering off;
        }

        location = /ws {
            limit_req zone=api_per_ip burst=60 nodelay;
            # Bound public connections per source; tune for shared NAT after measured load testing.
            limit_conn ws_conn_per_ip 60;
            proxy_pass http://samidev_realtime/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $samidev_forwarded_proto;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_buffering off;
        }

        # Runtime-safe public client configuration (contains no secrets).
        location = /client-config.js {
            proxy_pass http://samidev_realtime/client-config.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /health {
            proxy_pass http://samidev_realtime/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Metrics are for local/private monitoring only.
        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://samidev_realtime/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Never serve hidden files even if one is accidentally copied under game/.
        location ~ (^|/)\. {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
            # Keep runtime/index files coherent across deploys. The project currently uses stable
            # filenames (main.js, browser-runtime.js, index.html), so a one-hour public cache can
            # mix old and new runtime code and produce intermittent blank canvases.
            add_header Cache-Control "no-cache, max-age=0, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        }
    }
}
